# XcodeGen spec. Run `xcodegen generate` to (re)create GitHubTrending.xcodeproj;
# the .xcodeproj is generated, so edit this file instead.
name: GitHubTrending

options:
  bundleIdPrefix: com.jmkim
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  # Host app (setup guide window only)
  GitHubTrending:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: TrendingWidget   # Embedded as Contents/PlugIns/TrendingWidget.appex
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GitHubTrending
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/GitHubTrending.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jmkim.GitHubTrending
        GENERATE_INFOPLIST_FILE: YES

  # Widget extension
  TrendingWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: GitHubTrending
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/TrendingWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true          # Required for widget extensions
        com.apple.security.network.client: true       # Without this every URLSession request fails
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jmkim.GitHubTrending.TrendingWidget  # Must be prefixed with the app ID
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
